name: Build and Deploy Homework Page

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
      - ".env.example"
      - "README.md"
      - "docs/**"
      - "scripts/**"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.schedule-guard.outputs.skipped }}
    env:
      NAVER_CAFE_BOARD_URL: ${{ secrets.NAVER_CAFE_BOARD_URL }}
      NAVER_COOKIE_HEADER: ${{ secrets.NAVER_COOKIE_HEADER }}
      HAS_NAVER_CREDENTIALS: ${{ secrets.NAVER_ID != '' && secrets.NAVER_PASSWORD != '' }}
      REQUIRE_LOGIN: ${{ vars.REQUIRE_LOGIN || 'true' }}
      MAX_POSTS: ${{ vars.MAX_POSTS || '80' }}
      DETAIL_CONCURRENCY: ${{ vars.DETAIL_CONCURRENCY || '4' }}
      CLASS_POST_LIMIT: ${{ vars.CLASS_POST_LIMIT || '2' }}
      HOMEWORK_AUTHOR: ${{ vars.HOMEWORK_AUTHOR || '그래그래그레이스' }}
      REFRESH_COOLDOWN_SECONDS: ${{ vars.REFRESH_COOLDOWN_SECONDS || '600' }}
      QUIET_HOURS_START: ${{ vars.QUIET_HOURS_START || '0' }}
      QUIET_HOURS_END: ${{ vars.QUIET_HOURS_END || '6' }}
      TIME_ZONE: ${{ vars.TIME_ZONE || 'Asia/Seoul' }}
      MIN_GENERATED_POSTS: ${{ vars.MIN_GENERATED_POSTS || '1' }}
      MIN_MATCHED_CLASSES: ${{ vars.MIN_MATCHED_CLASSES || '1' }}
      MAX_GENERATED_AGE_MINUTES: ${{ vars.MAX_GENERATED_AGE_MINUTES || '30' }}
      ALLOW_STALE_FALLBACK_DEPLOY: ${{ vars.ALLOW_STALE_FALLBACK_DEPLOY || 'false' }}
      LOCAL_PUBLISH_MODE: ${{ vars.LOCAL_PUBLISH_MODE || 'false' }}
      NAVER_SESSION_REFRESH_HOUR: ${{ vars.NAVER_SESSION_REFRESH_HOUR || '7' }}
      HEADLESS: "true"
      OUTPUT_DIR: ./public
      DATA_FILE: ./public/homework.json
      HTML_FILE: ./public/index.html
      STATE_FILE: ./public/run-state.json
      PAGE_TITLE: ${{ vars.PAGE_TITLE || 'TopStar 영어학원 숙제 체크리스트' }}
      APP_LOGO_FILE: ./assets/topstar-logo.png
      PAGES_URL: https://mlc-cpu.github.io/topstar_eng/
      SHORT_URL: https://is.gd/qDMgMU
    steps:
      - name: Schedule guard
        id: schedule-guard
        run: |
          skipped=false
          reason=""

          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_publish_mode="$(printf '%s' "${LOCAL_PUBLISH_MODE:-false}" | tr '[:upper:]' '[:lower:]')"
            if [ "$local_publish_mode" = "true" ]; then
              skipped=true
              reason="local_publish_mode"
              echo "::notice::scheduled GitHub-hosted sync skipped: LOCAL_PUBLISH_MODE=true."
            fi
          fi

          if [ "$skipped" != true ] && [ "${{ github.event_name }}" = "schedule" ]; then
            current_hour=$((10#$(TZ=Asia/Seoul date +%H)))
            start_hour=$((10#${QUIET_HOURS_START}))
            end_hour=$((10#${QUIET_HOURS_END}))
            if [ "${start_hour}" -lt "${end_hour}" ]; then
              if [ "${current_hour}" -ge "${start_hour}" ] && [ "${current_hour}" -lt "${end_hour}" ]; then
                skipped=true
                reason="quiet_hours"
              fi
            elif [ "${start_hour}" -gt "${end_hour}" ]; then
              if [ "${current_hour}" -ge "${start_hour}" ] || [ "${current_hour}" -lt "${end_hour}" ]; then
                skipped=true
                reason="quiet_hours"
              fi
            fi
          fi

          if [ "$skipped" != true ] && [ "${{ github.event_name }}" = "schedule" ]; then
            tmp_json="$(mktemp)"
            if curl -fsSL "${PAGES_URL%/}/homework.json" -o "$tmp_json"; then
              generated_at="$(node -e "const fs=require('fs');try{const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(data?.generatedAt || ''));}catch{process.exit(1)}" "$tmp_json" || true)"
              if [ -n "$generated_at" ]; then
                now_epoch="$(date -u +%s)"
                generated_epoch="$(node -e "const value=Date.parse(process.argv[1]);if(Number.isFinite(value)){process.stdout.write(String(Math.floor(value/1000)));}" "$generated_at")"
                if [ -n "$generated_epoch" ]; then
                  elapsed_seconds=$(( now_epoch - generated_epoch ))
                  cooldown_seconds=$((10#${REFRESH_COOLDOWN_SECONDS}))
                  if [ "$elapsed_seconds" -ge 0 ] && [ "$elapsed_seconds" -lt "$cooldown_seconds" ]; then
                    skipped=true
                    reason="cooldown"
                    remaining_seconds=$(( cooldown_seconds - elapsed_seconds ))
                    echo "::notice::scheduled sync skipped: cooldown active (${remaining_seconds}s remaining)."
                  fi
                fi
              fi
            fi
            rm -f "$tmp_json"
          fi

          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.schedule-guard.outputs.skipped != 'true'
        uses: actions/checkout@v4

      - name: Detect prebuilt docs publish
        id: prebuilt
        if: steps.schedule-guard.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          use_prebuilt=false

          if [ "${{ github.event_name }}" = "push" ]; then
            commit_message="$(git log -1 --pretty=%B)"
            if printf '%s' "$commit_message" | grep -q '\[local-sync\]'; then
              use_prebuilt=true
            fi
          fi

          echo "use_prebuilt=${use_prebuilt}" >> "$GITHUB_OUTPUT"
          echo "::notice::use_prebuilt_docs=${use_prebuilt}"

      - name: Prepare prebuilt docs
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt == 'true'
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public

          required_missing=0
          for file in homework.json index.html; do
            if [ ! -s "docs/${file}" ]; then
              echo "::error::docs/${file} is missing or empty."
              required_missing=1
            fi
          done
          if [ "$required_missing" -ne 0 ]; then
            exit 1
          fi

          for file in homework.json index.html manifest.webmanifest sw.js icon.png icon.svg short-url.txt .nojekyll; do
            if [ -e "docs/${file}" ]; then
              cp "docs/${file}" "public/${file}"
            fi
          done
          : > public/.nojekyll

      - name: Validate prebuilt docs
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("public/homework.json", "utf8"));
          const issues = [];

          if (!payload.generatedAt || Number.isNaN(Date.parse(payload.generatedAt))) {
            issues.push("generatedAt must be a valid ISO date");
          }
          if (!Array.isArray(payload.posts) || payload.posts.length < 1) {
            issues.push("posts must contain at least one post");
          } else {
            payload.posts.forEach((post, index) => {
              if (
                Array.isArray(post.items) &&
                post.items.length === 1 &&
                String(post.items[0]?.text || "").trim() === "게시글 원문을 확인하세요."
              ) {
                issues.push(`posts[${index}] contains only the fallback source-check item`);
              }
            });
          }
          if (!payload.matchedClassCount || payload.matchedClassCount < 1) {
            issues.push("matchedClassCount must be at least 1");
          }

          if (issues.length > 0) {
            for (const issue of issues) {
              console.error(`::error::${issue}`);
            }
            process.exit(1);
          }

          console.log(
            `prebuilt docs ok: generatedAt=${payload.generatedAt}, posts=${payload.posts.length}`
          );
          NODE

      - name: Setup Node
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore optional storage state
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        env:
          NAVER_STORAGE_STATE_JSON: ${{ secrets.NAVER_STORAGE_STATE_JSON }}
        run: |
          if [ -n "${NAVER_STORAGE_STATE_JSON:-}" ]; then
            mkdir -p .state
            printf '%s' "$NAVER_STORAGE_STATE_JSON" > .state/naver-storage-state.json
          fi

      - name: Resolve auth strategy
        id: auth-strategy
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        run: |
          set -euo pipefail
          has_state=false
          if [ -s ".state/naver-storage-state.json" ]; then
            has_state=true
          fi

          strategy="none"
          has_credentials="${HAS_NAVER_CREDENTIALS}"

          if [ "$has_state" = true ]; then
            # Prefer captcha-passed storage state first to avoid frequent login challenges.
            strategy="storage_state_first"
          elif [ "$has_credentials" = true ]; then
            strategy="credentials_only"
          else
            strategy="none"
          fi

          echo "strategy=${strategy}" >> "$GITHUB_OUTPUT"
          echo "has_state=${has_state}" >> "$GITHUB_OUTPUT"
          echo "has_credentials=${has_credentials}" >> "$GITHUB_OUTPUT"
          echo "::notice::naver auth strategy=${strategy}"

      - name: Randomized schedule delay
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true' && github.event_name == 'schedule'
        env:
          SCHEDULE_JITTER_MAX_SECONDS: ${{ vars.SCHEDULE_JITTER_MAX_SECONDS || '240' }}
        run: |
          set -euo pipefail
          max="${SCHEDULE_JITTER_MAX_SECONDS:-240}"
          if ! [[ "$max" =~ ^[0-9]+$ ]]; then
            max=240
          fi
          if [ "$max" -lt 0 ]; then
            max=0
          fi
          if [ "$max" -gt 240 ]; then
            max=240
          fi

          delay=$(( RANDOM % (max + 1) ))
          echo "Applying randomized schedule delay: ${delay}s"
          sleep "$delay"

      - name: Build static page
        id: build-static
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
        run: |
          set -euo pipefail

          run_sync() {
            if [ "${{ github.event_name }}" = "schedule" ]; then
              npm run sync -- --scheduled
            else
              npm run sync
            fi
          }

          if run_sync; then
            echo "sync_succeeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.auth-strategy.outputs.strategy }}" = "none" ]; then
            echo "::warning::No NAVER auth configured (NAVER_ID/NAVER_PASSWORD or NAVER_STORAGE_STATE_JSON)."
          fi

          if [ "${{ steps.auth-strategy.outputs.strategy }}" = "storage_state_first" ] && [ "${{ steps.auth-strategy.outputs.has_credentials }}" = "true" ]; then
            echo "::warning::sync failed with storage state. Retrying once with credential-only mode."
            rm -f .state/naver-storage-state.json
            sleep 3
          else
            echo "::warning::sync failed on first attempt, retrying once in 5s."
            sleep 5
          fi

          if run_sync; then
            echo "sync_succeeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sync_succeeded=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "::error::sync failed on a manual/push run. Not deploying stale fallback files."
            exit 1
          fi

          allow_stale_fallback="$(printf '%s' "${ALLOW_STALE_FALLBACK_DEPLOY:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$allow_stale_fallback" != "true" ]; then
            echo "::error::scheduled sync failed. Keeping the existing Pages deployment and failing this run so the issue is visible."
            exit 1
          fi

          echo "::warning::sync failed again. ALLOW_STALE_FALLBACK_DEPLOY=true, so restoring fallback static files."
          mkdir -p public

          restore_from_pages() {
            local file="$1"
            local base_url="${PAGES_URL%/}"
            curl -fsSL "${base_url}/${file}" -o "public/${file}"
          }

          restore_from_repo() {
            local file="$1"
            local source_file="docs/${file}"
            if [ ! -f "$source_file" ]; then
              return 1
            fi

            cp "$source_file" "public/${file}"
          }

          restore_file() {
            local file="$1"
            if restore_from_pages "$file"; then
              echo "::notice::Restored ${file} from deployed Pages."
              return 0
            fi

            if restore_from_repo "$file"; then
              echo "::warning::Pages restore failed for ${file}; used repository snapshot docs/${file}."
              return 0
            fi

            echo "::error::Failed to restore ${file} from both Pages and docs/."
            return 1
          }

          restore_failed=0
          for file in homework.json index.html manifest.webmanifest sw.js icon.png icon.svg short-url.txt; do
            if ! restore_file "$file"; then
              restore_failed=1
            fi
          done
          : > public/.nojekyll

          if [ "$restore_failed" -ne 0 ] || [ ! -s public/homework.json ] || [ ! -s public/index.html ]; then
            echo "::error::Fallback static site restore was incomplete."
            exit 1
          fi

      - name: Validate generated homework data
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.build-static.outputs.sync_succeeded == 'true'
        run: npm run validate

      - name: Refresh NAVER storage state proactively
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true' && steps.build-static.outputs.sync_succeeded == 'true'
        continue-on-error: true
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
        run: |
          set -euo pipefail

          should_refresh=false
          if [ "${{ github.event_name }}" != "schedule" ]; then
            should_refresh=true
          else
            current_hour="$(TZ="${TIME_ZONE}" date +%H)"
            current_minute="$(TZ="${TIME_ZONE}" date +%M)"
            refresh_hour="${NAVER_SESSION_REFRESH_HOUR:-7}"
            if ! [[ "$refresh_hour" =~ ^[0-9]+$ ]]; then
              refresh_hour=7
            fi
            refresh_hour=$((10#$refresh_hour))
            if [ "$refresh_hour" -lt 0 ] || [ "$refresh_hour" -gt 23 ]; then
              refresh_hour=7
            fi
            refresh_hour_padded="$(printf '%02d' "$refresh_hour")"

            if [ "$current_hour" = "$refresh_hour_padded" ] && [ "$current_minute" = "02" ]; then
              should_refresh=true
            fi
          fi

          if [ "$should_refresh" != true ]; then
            echo "::notice::Skipping proactive storage state refresh for this run."
            exit 0
          fi

          npm run refresh-session

      - name: Rotate NAVER storage-state secret
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true' && steps.build-static.outputs.sync_succeeded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN != '' && secrets.GH_SECRET_UPDATE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [ ! -s ".state/naver-storage-state.json" ]; then
            echo "::notice::No storage state file generated in this run."
            exit 0
          fi

          # Keep the value compact and validated before updating the secret.
          node -e "const fs=require('fs');const p='.state/naver-storage-state.json';const v=JSON.parse(fs.readFileSync(p,'utf8'));fs.writeFileSync(p,JSON.stringify(v));"

          if gh secret set NAVER_STORAGE_STATE_JSON --repo "$GITHUB_REPOSITORY" < .state/naver-storage-state.json; then
            echo "::notice::NAVER_STORAGE_STATE_JSON rotated successfully."
          else
            echo "::warning::Failed to rotate NAVER_STORAGE_STATE_JSON (insufficient token permission). Set GH_SECRET_UPDATE_TOKEN to enable guaranteed rotation."
          fi

      - name: Remove transient auth files
        if: steps.schedule-guard.outputs.skipped != 'true' && steps.prebuilt.outputs.use_prebuilt != 'true'
        run: rm -f .state/naver-storage-state.json

      - name: Upload Pages artifact
        if: steps.schedule-guard.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: needs.build.outputs.skipped != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
